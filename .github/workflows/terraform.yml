name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-check:
    name: Terraform Format, Validate and Security Scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - prod

    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true

  terraform-plan-dev:
    name: Generate Development Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-check

    # Generate a development plan only after a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::391732005521:role/GitHubTerraformPlanRole
          aws-region: us-east-1
          role-session-name: GitHubTerraformDevPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform with S3 backend
        run: terraform init -input=false

      - name: Generate Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
        env:
          TF_VAR_aws_region: us-east-1
          TF_VAR_ami_id: ami-004d1eaf8eaa0107d
          TF_VAR_instance_type: t3.micro
          TF_VAR_vpc_cidr_block: 10.0.0.0/16
          TF_VAR_subnet_cidr_block: 10.0.1.0/24
          TF_VAR_availability_zone: us-east-1a
          TF_VAR_bucket_name: priyanshu-terraform-app-391732005521-2026
          TF_VAR_ssh_cidr: 106.222.251.240/32

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: environments/dev/tfplan
          retention-days: 3