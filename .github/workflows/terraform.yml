name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  aws-oidc-test:
    name: Test GitHub-to-AWS OIDC
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::391732005521:role/GitHubTerraformPlanRole
          aws-region: us-east-1
          role-session-name: GitHubTerraformOIDCTest

      - name: Verify AWS identity
        run: aws sts get-caller-identity